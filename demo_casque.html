<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Demo casque — avant / après</title>
  <style>
    body {
      background: #251C33;
      display: flex;
      gap: 80px;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Courier New', monospace;
    }
    .col {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .label {
      color: #EFB63C;
      font-size: .75rem;
      letter-spacing: .18em;
      text-transform: uppercase;
    }
    .note {
      color: #665D74;
      font-size: .65rem;
      letter-spacing: .08em;
      max-width: 160px;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>
<body>

  <!-- AVANT -->
  <div class="col">
    <span class="label">Avant</span>
    <svg width="180" height="240" viewBox="0 0 152 240">

      <!-- SOL -->
      <rect x="30" y="218" width="100" height="7" rx="3" fill="#1E1628"/>

      <!-- JAMBES -->
      <rect x="52" y="164" width="20" height="46" rx="10" fill="#3B2F4E"/>
      <rect x="78" y="164" width="20" height="46" rx="10" fill="#3B2F4E"/>
      <!-- Ombres pieds -->
      <ellipse cx="62" cy="210" rx="19" ry="9" fill="#2E2341"/>
      <ellipse cx="88" cy="210" rx="19" ry="9" fill="#2E2341"/>

      <!-- CORPS -->
      <rect x="42" y="114" width="66" height="58" rx="22" fill="#5170ff"/>

      <!-- COL -->
      <rect x="63" y="106" width="26" height="14" rx="7" fill="#EDE7F6"/>

      <!-- TÊTE -->
      <circle cx="76" cy="72" r="46" fill="#EDE7F6"/>

      <!-- Casque — DOME -->
      <path d="M27 70 Q27 22 76 22 Q125 22 125 70" fill="#EFB63C"/>
      <!-- Casque — PICOTS -->
      <path d="M62 29 Q61 16 76 13 Q91 16 90 29 Z" fill="#EFB63C"/>
      <path d="M45 32 Q44 24 53 21 Q62 24 61 32 Z" fill="#EFB63C"/>
      <path d="M91 32 Q90 24 99 21 Q108 24 107 32 Z" fill="#EFB63C"/>
      <!-- Casque — BORD -->
      <rect x="21" y="63" width="110" height="13" rx="6" fill="#EFB63C"/>
      <rect x="21" y="63" width="110" height="7"  rx="3" fill="#F5CA50"/>

      <!-- Joues -->
      <ellipse cx="43"  cy="88" rx="11" ry="8" fill="#F4A0B0" opacity=".45"/>
      <ellipse cx="109" cy="88" rx="11" ry="8" fill="#F4A0B0" opacity=".45"/>

      <!-- YEUX -->
      <circle cx="59" cy="77" r="13" fill="white"/>
      <circle cx="93" cy="77" r="13" fill="white"/>
      <circle cx="62" cy="79" r="8" fill="#251C33"/>
      <circle cx="64" cy="76" r="3" fill="white"/>
      <circle cx="96" cy="79" r="8" fill="#251C33"/>
      <circle cx="98" cy="76" r="3" fill="white"/>

      <!-- SOURCILS — passent au-dessus du casque -->
      <path d="M47 62 Q59 55 69 61" fill="none" stroke="#251C33" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M83 61 Q93 55 105 62" fill="none" stroke="#251C33" stroke-width="3.5" stroke-linecap="round"/>

      <!-- SOURIRE -->
      <path d="M57 89 Q76 108 95 89" fill="none" stroke="#251C33" stroke-width="4" stroke-linecap="round"/>

      <!-- BRAS -->
      <rect x="6"  y="126" width="36" height="16" rx="8" fill="#5170ff"/>
      <circle cx="6"  cy="134" r="10" fill="#EDE7F6"/>
      <rect x="108" y="126" width="38" height="16" rx="8" fill="#5170ff"/>
      <circle cx="146" cy="134" r="10" fill="#EDE7F6"/>

    </svg>
    <p class="note">Yeux + sourcils passent au-dessus du bord du casque</p>
  </div>

  <!-- APRÈS -->
  <div class="col">
    <span class="label">Après</span>
    <svg width="180" height="240" viewBox="0 -20 152 260">

      <!-- SOL -->
      <rect x="30" y="218" width="100" height="7" rx="3" fill="#1E1628"/>

      <!-- JAMBES -->
      <rect x="52" y="164" width="20" height="46" rx="10" fill="#3B2F4E"/>
      <rect x="78" y="164" width="20" height="46" rx="10" fill="#3B2F4E"/>
      <ellipse cx="62" cy="210" rx="19" ry="9" fill="#2E2341"/>
      <ellipse cx="88" cy="210" rx="19" ry="9" fill="#2E2341"/>

      <!-- CORPS -->
      <rect x="42" y="114" width="66" height="58" rx="22" fill="#5170ff"/>

      <!-- COL -->
      <rect x="63" y="106" width="26" height="14" rx="7" fill="#EDE7F6"/>

      <!-- TÊTE -->
      <circle cx="76" cy="72" r="46" fill="#EDE7F6"/>

      <!-- CHEVEUX — 1 boule aplatie de chaque côté, sous le bord du casque -->
      <ellipse cx="26" cy="57" rx="9" ry="12" fill="#6B3A2A"/>
      <ellipse cx="23" cy="53" rx="2.5" ry="3.5" fill="#8C5240" opacity=".7"/>
      <ellipse cx="126" cy="57" rx="9" ry="12" fill="#6B3A2A"/>
      <ellipse cx="129" cy="53" rx="2.5" ry="3.5" fill="#8C5240" opacity=".7"/>

      <!-- Casque — DOME (relevé de 25px) -->
      <path d="M27 45 Q27 -3 76 -3 Q125 -3 125 45" fill="#EFB63C"/>
      <!-- Casque — PICOTS (relevés de 25px) -->
      <path d="M62  4 Q61 -9 76 -12 Q91 -9  90  4 Z" fill="#EFB63C"/>
      <path d="M45  7 Q44 -1 53  -4 Q62 -1  61  7 Z" fill="#EFB63C"/>
      <path d="M91  7 Q90 -1 99  -4 Q108 -1 107  7 Z" fill="#EFB63C"/>
      <!-- Casque — BORD (relevé de 25px, bord bas à y=51) -->
      <rect x="21" y="38" width="110" height="13" rx="6" fill="#EFB63C"/>
      <rect x="21" y="38" width="110" height="7"  rx="3" fill="#F5CA50"/>

      <!-- Joues (inchangées) -->
      <ellipse cx="43"  cy="88" rx="11" ry="8" fill="#F4A0B0" opacity=".45"/>
      <ellipse cx="109" cy="88" rx="11" ry="8" fill="#F4A0B0" opacity=".45"/>

      <!-- YEUX (inchangés) -->
      <circle cx="59" cy="77" r="13" fill="white"/>
      <circle cx="93" cy="77" r="13" fill="white"/>
      <circle cx="62" cy="79" r="8" fill="#251C33"/>
      <circle cx="64" cy="76" r="3" fill="white"/>
      <circle cx="96" cy="79" r="8" fill="#251C33"/>
      <circle cx="98" cy="76" r="3" fill="white"/>

      <!-- SOURCILS — bien sous le bord -->
      <path d="M47 62 Q59 55 69 61" fill="none" stroke="#251C33" stroke-width="3.5" stroke-linecap="round"/>
      <path d="M83 61 Q93 55 105 62" fill="none" stroke="#251C33" stroke-width="3.5" stroke-linecap="round"/>

      <!-- SOURIRE -->
      <path d="M57 89 Q76 108 95 89" fill="none" stroke="#251C33" stroke-width="4" stroke-linecap="round"/>

      <!-- BRAS -->
      <rect x="6"  y="126" width="36" height="16" rx="8" fill="#5170ff"/>
      <circle cx="6"  cy="134" r="10" fill="#EDE7F6"/>
      <rect x="108" y="126" width="38" height="16" rx="8" fill="#5170ff"/>
      <circle cx="146" cy="134" r="10" fill="#EDE7F6"/>

    </svg>
    <p class="note">Bord clairement au-dessus des sourcils et des yeux</p>
  </div>

</body>
</html>
